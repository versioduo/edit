  <body>
    <nav>
      <h1>
        <a href="#">V2 edit</a>
      </h1>
      <details>
        <summary></summary>
        <ul onclick="parentNode.open = false">
        </ul>
      </details>

    <main class="--grid"></main>
    <script src="js/V2App.js"></script>
    <script src="js/V2Editor.js"></script>
    <script src="js/V2EditorTrack.js"></script>
    <script src="js/V2MIDI.js"></script>
    <script src="js/V2MIDIFile.js"></script>
    <script>
      'use strict';

      new V2App((app) => {
        app.editor = null;
        Object.seal(app);

        new V2Editor(app);

        // Cache the content for offline operation.
        app.registerServiceWorker('service-worker.js', (state, newWorker) => {
          // There is no worker during the intial setup.
          if (!navigator.serviceWorker.controller)
            return;

          switch (state) {
            case 'installed':
              // A new version was installed into the cache and a new worker is waiting to take control.
              app.notifyUpdate('A fresh version is available', () => {
                newWorker.postMessage({
                  type: 'skipWaiting'
                });
              });
              break;

            case 'activated':
              // A new worker took control over the page.
              location.reload();
              break;
          }
        });
      });
    </script>
  </body>
